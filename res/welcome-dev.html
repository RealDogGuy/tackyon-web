<style type="text/css">
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: linear-gradient(to top, #000000 0%, #010101 66%, #0f1118 100%);
    }

    @font-face {
        font-family: "Sora";
        src: url("themes/tackyon/fonts/Sora-Regular.woff2") format("woff2");
        font-style: normal;
        font-weight: 400;
        font-display: swap;
    }

    @font-face {
        font-family: "Azeret Mono";
        src: url("themes/tackyon/fonts/AzeretMono-ExtraLight.woff2") format("woff2");
        font-style: normal;
        font-weight: 200;
        font-display: swap;
    }

    .mx_Parent {
        box-sizing: border-box;
        min-height: auto;
        width: 100%;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: "Azeret Mono", Inter, sans-serif;
        color: #f1f1f1;
        background: transparent;
    }

    .mx_Card {
        width: 100%;
        max-width: 540px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(8, 9, 12, 0.79);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
        padding: 26px 18px 14px;
        text-align: left;
    }

    .mx_Brand {
        margin: 0;
        font-family: "Sora", Inter, sans-serif;
        font-size: 68px;
        line-height: 1;
        font-weight: 400;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #ffffff;
    }

    .mx_Divider {
        margin: 8px 0 18px;
        color: rgba(255, 255, 255, 0.66);
        font-size: 14px;
        line-height: 1;
        letter-spacing: 0.02em;
        white-space: nowrap;
        overflow: hidden;
        position: relative;
        width: 100%;
        height: 1em;
    }

    .mx_Divider::before {
        content: "[--------------------------------------------------------]";
    }

    .mx_Divider::after {
        content: ">";
        position: absolute;
        top: 0;
        left: 0;
        animation: mx_DividerScan 9s steps(57, end) infinite;
    }

    @keyframes mx_DividerScan {
        from {
            transform: translateX(0ch);
        }
        to {
            transform: translateX(56ch);
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .mx_Divider::before {
            content: ">--------------------------------------------------------]";
        }

        .mx_Divider::after {
            content: "";
            animation: none;
        }
    }

    .mx_Tagline {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        letter-spacing: 0.01em;
        text-transform: none;
        color: rgba(255, 255, 255, 0.66);
    }

    .mx_ButtonGroup {
        margin-top: 14px;
    }

    .mx_ButtonRow {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }

    .mx_ButtonParent {
        display: inline-flex;
        align-items: center;
        justify-content: flex-start;
        gap: 10px;
        min-height: 48px;
        flex: 1 1 0;
        box-sizing: border-box;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        font-family: "Azeret Mono", Inter, sans-serif;
        font-size: 11px;
        letter-spacing: 0.01em;
        text-transform: none;
        text-decoration: none;
        padding: 0 14px;
        transition: opacity 120ms ease;
    }

    .mx_ButtonParent:hover {
        opacity: 0.98;
        filter: brightness(1.08);
    }

    .mx_ButtonSignIn {
        background: #020202;
        color: #ffffff !important;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .mx_ButtonCreateAccount {
        background: #06070b;
        color: rgba(255, 255, 255, 0.86) !important;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    .mx_ButtonIcon {
        width: 16px;
        height: 16px;
        object-fit: contain;
        display: inline-block;
        opacity: 0.9;
    }

    .mx_ButtonLabel {
        white-space: nowrap;
    }

    .mx_Footer {
        margin: 14px 0 0;
        font-size: 10px;
        line-height: 1.5;
        letter-spacing: 0.08em;
        text-transform: none;
        color: rgba(255, 255, 255, 0.42);
        text-align: center;
    }

    .mx_WelcomePage:not(.mx_WelcomePage_loggedIn) .mx_WelcomePage_guestFunctions {
        display: none;
    }

    .mx_ButtonRow.mx_WelcomePage_guestFunctions {
        margin-top: 8px;
    }

    .mx_ButtonRow.mx_WelcomePage_guestFunctions > div {
        margin: 0;
        width: 100%;
    }

    .mx_AuthPage {
        overscroll-behavior-y: contain;
        overflow-y: auto;
    }

    .mx_AuthPage_modal {
        margin: 0 auto;
        min-height: calc(100vh - 84px);
        display: flex;
        align-items: center;
    }

    .mx_AuthBody_language {
        width: auto;
        margin: 0 auto 8px;
        font-family: "Azeret Mono", Inter, sans-serif;
    }

    .mx_AuthBody_language .mx_Dropdown_input {
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(10, 10, 10, 0.35);
        color: rgba(255, 255, 255, 0.72);
        font-family: "Azeret Mono", Inter, sans-serif;
        font-size: 10px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        min-height: 30px;
        border-radius: 999px;
        padding: 0 8px;
    }

    .mx_AuthBody_language .mx_Dropdown_arrow {
        color: rgba(255, 255, 255, 0.62);
    }

    .mx_AuthFooter {
        text-align: center;
        font-family: "Azeret Mono", Inter, sans-serif;
    }

    .mx_AuthFooter a {
        display: none;
    }

    .mx_AuthFooter a[href*="github.com"] {
        display: inline-block;
        margin: 0;
        color: rgba(255, 255, 255, 0.62);
        letter-spacing: 0.05em;
        text-transform: uppercase;
    }

    @media only screen and (max-width: 560px) {
        .mx_Parent {
            padding: 16px;
        }

        .mx_Card {
            border-radius: 10px;
            padding: 20px 14px 14px;
        }

        .mx_Brand {
            font-size: 44px;
        }

        .mx_ButtonRow {
            flex-direction: column;
        }

        .mx_ButtonParent {
            width: 100%;
            font-size: 11px;
        }
    }
</style>

<div class="mx_Parent">
    <div class="mx_Card">
        <h1 class="mx_Brand">TACKYON</h1>
        <div class="mx_Divider" aria-hidden="true"></div>
        <p class="mx_Tagline">the disenshittification of Discord</p>
        <div class="mx_ButtonGroup">
            <div class="mx_ButtonRow">
                <a href="#/login" class="mx_ButtonParent mx_ButtonSignIn">
                    <img src="themes/tackyon/icons/signin.png" alt="" class="mx_ButtonIcon" />
                    <span class="mx_ButtonLabel">_t("action|sign_in")</span>
                </a>
                <a href="#/register" class="mx_ButtonParent mx_ButtonCreateAccount">
                    <img src="themes/tackyon/icons/personadd.png" alt="" class="mx_ButtonIcon" />
                    <span class="mx_ButtonLabel">Request Invite</span>
                </a>
            </div>
            <div class="mx_ButtonRow mx_WelcomePage_guestFunctions">
                <div>
                    <a href="#/directory" class="mx_ButtonParent mx_ButtonCreateAccount">
                        <span class="mx_ButtonLabel">_t("action|explore_rooms")</span>
                    </a>
                </div>
            </div>
        </div>
        <p class="mx_Footer">Decentralized · E2EE available · No telemetry</p>
    </div>
</div>
